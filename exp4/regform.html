<html>
<head>
<title>form</title>
</head>
<body bgcolor="lightpink">
<center>
<h1><b>REGISTRATION FORM</b></h1><br><br>
<form action="#" methode="post">
<label for="name">Name      :</label>
<input type="text" id="name" name="name" required><br><br>
<label for="email">Email  :</label>
<input type="email" id="email" name="email" required><br><br>
<label for="phone">Phone no      :</label>
<input type="number" id="phone" name="phone" required><br><br>
<label for="password">Password   :</label>
<input type="password" id="password" name="password"required ><br><br>
<label for="address">Address   :</label>
<textarea  id="address" name="address" rows="4" cols="30" required></textarea><br><br>
<label for="qua">Qualification   :</label>
<select id="qua" name="qua" required>
<option value="sslc">SSLC<option>
<option value="p2">Plus Two<option>
<option value="ug">UG<option>
<option value="pg">PG<option>
</select><br><br>
<label>Gender   :</label>
<input type="radio" id="male" name="gender" value="male">
<label for="male">Male</label>
<input type="radio" id="female" name="gender" value="female">
<label for="female">Female</label><br><br>
<label>Interests    :</label>
<input type="checkbox" id="sports" name="interests" value="sports" >
<label for="sports">Sports</label>
<input type="checkbox" id="music" name="interests" value="music">
<label for="music">Music</label>
<input type="checkbox" id="travel" name="interests" value="travel">
<label for="travel">Travel</label><br><br>
Image:
<input type="file" id="photo" name="photo" accept="image/*" required><br><br>
<input type="submit" value="Submit"><br><br>
<input type="reset" value="Reset"><br>
</form>
</center>
</body>
</html>
